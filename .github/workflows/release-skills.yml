name: Release Skills

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyyaml
      - name: Validate plugin manifest
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            python scripts/validate_plugin.py --expected-version "${GITHUB_REF_NAME#v}"
          else
            python scripts/validate_plugin.py
          fi
      - run: python scripts/validate_skills.py

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pyyaml
      - run: python scripts/build_skill_archives.py --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: skill-archives
          path: dist/*.zip

  verify:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: skill-archives
          path: dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_archives.py dist

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: skill-archives
          path: dist
      - name: Generate checksums
        shell: bash
        run: sha256sum dist/*.zip > dist/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
